<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Codia</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Roboto, sans-serif;
      background: #f7f7f8;
      color: #111;
      height: 100vh;
      overflow: hidden;
    }
    .app {
      max-width: 430px;
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #f7f7f8;
    }
    .header {
      background: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #eee;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
    }
    .name { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; color: #8e8e93; }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
    }
    .empty {
      text-align: center;
      color: #8e8e93;
      margin-top: 80px;
      font-size: 16px;
    }
    .bottom {
      height: 70px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .nav {
      background: none;
      border: none;
      color: #b0b0b5;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .nav.active { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="header">
      <div class="logo">C</div>
      <div>
        <div class="name">Codia</div>
        <div class="sub">16,254k members</div>
      </div>
    </div>

    <div class="content">
      <div class="empty" id="status">
        Chargement de Codia...
      </div>
    </div>

    <div class="bottom">
      <button class="nav active">⌂<br>Feed</button>
      <button class="nav">◇<br>Discover</button>
      <button class="nav">☺<br>Profil</button>
    </div>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const status = document.getElementById('status');

    // Test simple
    status.innerHTML = `
      <div style="font-size:18px;font-weight:700;margin-bottom:10px">Codia fonctionne ✅</div>
      <div style="color:#666;font-size:14px">
        Si tu vois ce message, le serveur et le miniapp marchent.<br><br>
        Dis-moi et je te redonne la version complète avec toutes les fonctionnalités.
      </div>
    `;
  </script>
</body>
</html>
