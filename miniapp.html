<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Codia</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,sans-serif;background:#fff;color:#111;height:100vh;overflow:hidden}
    .hidden{display:none !important}
    .app{max-width:430px;height:100vh;margin:0 auto;display:flex;flex-direction:column;background:#f7f7f8;position:relative}

    .header{background:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee}
    .logo-c{width:48px;height:48px;border-radius:50%;background:#8b5cf6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex:0 0 48px}
    .header .name{font-size:20px;font-weight:700;color:#111}
    .header .sub{font-size:13px;color:#8e8e93;margin-top:1px}

    .stories{background:#fff;display:flex;gap:14px;overflow-x:auto;padding:14px 16px 12px;border-bottom:1px solid #f0f0f0}
    .story{min-width:64px;text-align:center;font-size:11px;color:#555}
    .story-bubble{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;background:#f3f0ff;color:#7c3aed;border:2px solid #e9e4ff}
    .story-bubble.top{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#fbbf24,#22c55e,#06b6d4) border-box;border:2.5px solid transparent}
    .story-bubble.uber{background:linear-gradient(135deg,#06b6d4,#ec4899,#f59e0b);color:#fff;border:none;font-size:9px;font-weight:800;line-height:1.1;text-align:center;padding:4px}
    .story-bubble.book{background:#fff;border:2px solid #38bdf8;color:#0ea5e9;font-size:18px;font-weight:900}
    .story-bubble.air{background:#fff;border:2px solid #f472b6;color:#ec4899;font-size:22px;font-weight:300}
    .story-bubble.plus{background:#f3f0ff;border:none;color:#7c3aed;font-size:26px}

    .page{display:none;flex:1;overflow-y:auto;padding:12px 12px 120px;background:#f7f7f8}
    .page.active{display:block}

    .post{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid #eee;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .post-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .post-avatar{width:40px;height:40px;border-radius:50%;background:#8b5cf6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;overflow:hidden;flex:0 0 40px}
    .post-avatar img{width:100%;height:100%;object-fit:cover}
    .post-who{font-weight:700;font-size:14px;color:#111}
    .post-meta{font-size:12px;color:#8e8e93;margin-top:1px}
    .post-desc{font-size:14px;color:#111;margin-bottom:10px;line-height:1.35}

    .code-box{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:12px}
    .code-left{display:flex;gap:10px;align-items:center;min-width:0}
    .code-check{width:28px;height:28px;border-radius:50%;background:#22c55e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:0 0 28px}
    .code-main{font-weight:800;font-size:16px;color:#15803d}
    .code-sub{font-size:12px;color:#16a34a;margin-top:1px}
    .copy-btn{border:1px solid #e5e5e5;background:#fff;color:#7c3aed;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap}

    .actions{display:flex;gap:8px;margin-top:10px}
    .actions button{border:1px solid #eee;background:#fafafa;color:#444;border-radius:999px;padding:6px 12px;font-size:13px}

    .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:20;border:none;color:#fff;font-weight:800;font-size:15px;padding:14px 28px;border-radius:999px;background:linear-gradient(90deg,#7c3aed,#ec4899);box-shadow:0 8px 24px rgba(124,58,237,.35)}
    .bottom{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;padding-bottom:10px}
    .nav{background:none;border:none;color:#b0b0b5;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;min-width:64px}
    .nav .ic{font-size:20px;line-height:1}
    .nav.active{color:#7c3aed}

    .search-wrap{padding:4px 0 10px}
    .search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:12px 14px}
    .search input{width:100%;border:none;outline:none;background:transparent;font-size:15px;color:#111}
    .section{font-size:12px;color:#8e8e93;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:8px 0}
    .card{background:#fff;border:1px solid #eee;border-radius:16px;padding:14px;margin-bottom:10px}
    .empty{text-align:center;color:#8e8e93;padding:28px 12px;font-size:14px}
    .follow-stats{display:flex;gap:30px;justify-content:center;margin:16px 0}
    .follow-stats div{text-align:center}
    .follow-stats strong{display:block;font-size:18px}

    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;align-items:flex-end;justify-content:center}
    .modal.active{display:flex}
    .sheet{width:100%;max-width:430px;background:#fff;border-radius:22px 22px 0 0;padding:22px 18px 34px}
    .sheet button,.sheet input{width:100%;margin-bottom:10px;padding:14px;border-radius:14px;border:1px solid #e8e8e8;background:#fafafa;color:#111;font-size:15px}
    .sheet .primary{background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;border:none;font-weight:700}
    .quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .quick button{width:auto;padding:8px 12px;margin:0;font-size:12px;border-radius:999px}
  </style>
</head>
<body>
<div class="app" id="main-app">
  <div class="header">
    <div class="logo-c">C</div>
    <div>
      <div class="name">Codia</div>
      <div class="sub">16,254k members</div>
    </div>
  </div>

  <div class="stories" id="stories"></div>

  <div class="page page-home active" id="page-home">
    <div id="codes-list"><div class="empty">Chargement...</div></div>
  </div>

  <div class="page" id="page-ia">
    <div class="search-wrap">
      <div class="search">
        <span style="opacity:.5">⌕</span>
        <input id="ai-input" placeholder="Ex: Uber Eats, Booking..." onkeypress="if(event.key==='Enter') askAI()">
      </div>
    </div>
    <div class="section">Résultats</div>
    <div id="search-results"><div class="empty">Lance une recherche</div></div>
  </div>

  <div class="page" id="page-profile">
    <div class="card" id="profile-card">Chargement profil...</div>
    
    <div class="follow-stats">
      <div><strong id="followers-count">0</strong>Abonnés</div>
      <div><strong id="following-count">0</strong>Abonnements</div>
    </div>

    <div class="section">Mes codes</div>
    <div id="my-codes"><div class="empty">Aucun code</div></div>
  </div>

  <button class="fab" id="fabShare" onclick="openShare()">＋ Partager</button>

  <div class="bottom">
    <button class="nav active" onclick="showPage('home')"><div class="ic">⌂</div>Feed</button>
    <button class="nav" onclick="showPage('ia')"><div class="ic">◇</div>Discover</button>
    <button class="nav" onclick="showPage('profile')"><div class="ic">☺</div>Profil</button>
  </div>
</div>

<div class="modal" id="shareModal">
  <div class="sheet">
    <div style="text-align:center;font-weight:700;margin-bottom:14px">Partager un code</div>
    <button class="primary" onclick="chooseShare('promo')">Code promo</button>
    <button class="primary" onclick="chooseShare('parrainage')">Code parrainage</button>
    <button onclick="closeShare()">Annuler</button>
  </div>
</div>

<div class="modal" id="formModal">
  <div class="sheet">
    <div style="text-align:center;font-weight:700;margin-bottom:14px" id="formTitle">Nouveau code</div>
    <div class="quick">
      <button type="button" onclick="fillSite('Uber Eats')">Uber Eats</button>
      <button type="button" onclick="fillSite('Booking')">Booking</button>
      <button type="button" onclick="fillSite('Airbnb')">Airbnb</button>
      <button type="button" onclick="fillSite('Zara')">Zara</button>
      <button type="button" onclick="fillSite('Fortuneo')">Fortuneo</button>
    </div>
    <input id="formSite" placeholder="Site">
    <input id="formCode" placeholder="Code">
    <input id="formDesc" placeholder="Ex: -20€ ou +80€">
    <button class="primary" onclick="submitCode()">Publier</button>
    <button onclick="closeForm()">Annuler</button>
  </div>
</div>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  try { Telegram.WebApp.setHeaderColor('#ffffff'); Telegram.WebApp.setBackgroundColor('#f7f7f8'); } catch(e){}

  const ADMIN_ID = 8091031583;
  let allCodes = [];
  let currentShareType = "promo";

  function getUser(){ return window.Telegram?.WebApp?.initDataUnsafe?.user || null; }
  function isAdmin(){ const u = getUser(); return u && Number(u.id) === ADMIN_ID; }

  function timeAgo(dateStr){
    if(!dateStr) return 'à l’instant';
    const diff = Math.max(0,(Date.now()-new Date(dateStr).getTime())/1000);
    if(diff<60) return 'à l’instant';
    if(diff<3600) return `il y a ${Math.floor(diff/60)} min`;
    if(diff<86400) return `il y a ${Math.floor(diff/3600)} h`;
    return `il y a ${Math.floor(diff/86400)} j`;
  }

  function showPage(page){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
    const fab = document.getElementById('fabShare');
    if(page==='home'){
      document.getElementById('page-home').classList.add('active');
      document.querySelectorAll('.nav')[0].classList.add('active');
      fab.style.display = 'block';
    } else if(page==='ia'){
      document.getElementById('page-ia').classList.add('active');
      document.querySelectorAll('.nav')[1].classList.add('active');
      fab.style.display = 'none';
    } else {
      document.getElementById('page-profile').classList.add('active');
      document.querySelectorAll('.nav')[2].classList.add('active');
      fab.style.display = 'none';
      loadProfile();
    }
  }

  function openShare(){ document.getElementById('shareModal').classList.add('active'); }
  function closeShare(){ document.getElementById('shareModal').classList.remove('active'); }
  function closeForm(){ document.getElementById('formModal').classList.remove('active'); }
  function fillSite(v){ document.getElementById('formSite').value=v; }

  function chooseShare(type){
    currentShareType=type; closeShare();
    document.getElementById('formTitle').textContent = type==='promo'?'Nouveau code promo':'Nouveau code parrainage';
    document.getElementById('formSite').value='';
    document.getElementById('formCode').value='';
    document.getElementById('formDesc').value='';
    document.getElementById('formModal').classList.add('active');
  }

  async function submitCode(){
    const site=document.getElementById('formSite').value.trim();
    const code=document.getElementById('formCode').value.trim();
    const description=document.getElementById('formDesc').value.trim();
    if(!site||!code){ alert('Site et code obligatoires'); return; }
    const u=getUser();
    const added_by=u?.username?('@'+u.username):(u?.first_name||'Membre Codia');
    try{
      const res=await fetch('/codes/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        type:currentShareType,site,code,description,added_by,user_id:u?.id||null,photo_url:u?.photo_url||null
      })});
      const data=await res.json();
      if(data.success){ closeForm(); await loadCodes(); showPage('home'); }
      else alert('Erreur publication');
    }catch(e){ alert('Erreur publication'); }
  }

  function avatarHTML(c){
    if(c.photo_url) return `<div class="post-avatar"><img src="${c.photo_url}"></div>`;
    const letter = (c.added_by||'C').replace('@','')[0].toUpperCase();
    return `<div class="post-avatar">${letter}</div>`;
  }

  function renderPost(c){
    const id=c.id;
    const liked=localStorage.getItem('like_'+id)==='1';
    const disliked=localStorage.getItem('dislike_'+id)==='1';
    const who=c.added_by||'Codia IA';
    const kind = c.type==='parrainage' ? 'shared a referral code' : 'shared a promo code';
    const desc = `${c.code} ${c.description||''}${c.site?(' for '+c.site):''}`.trim();
    const copies=c.copies||0;

    return `<div class="post">
      <div class="post-top">
        ${avatarHTML(c)}
        <div style="flex:1">
          <div class="post-who">${who}</div>
          <div class="post-meta">${kind} · ${timeAgo(c.created_at)}</div>
        </div>
      </div>
      <div class="post-desc">${desc}</div>
      <div class="code-box">
        <div class="code-left">
          <div class="code-check">✓</div>
          <div>
            <div class="code-main">${c.code}</div>
            <div class="code-sub">${c.description||''}</div>
          </div>
        </div>
        <button class="copy-btn" onclick="copyCode(${c.id||0}, '${String(c.code).replace(/'/g,"\\'")}', this)">Copier${copies?' · '+copies:''}</button>
      </div>
      <div class="actions">
        <button onclick="toggleReact(${c.id},'like',this)">${liked?'❤️':'🤍'} ${c.likes||0}</button>
        <button onclick="toggleReact(${c.id},'dislike',this)">${disliked?'💔':'👎'} ${c.dislikes||0}</button>
      </div>
    </div>`;
  }

  async function copyCode(id, code, btn){
    try{ await navigator.clipboard.writeText(code); }catch(e){ alert(code); }
    btn.textContent='Copié';
    if(id){
      const u = getUser();
      try{
        const res=await fetch('/code/copy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id, user_id: u?.id})});
        const data=await res.json();
        if(data.copies!==undefined){ setTimeout(()=>btn.textContent=`Copier · ${data.copies}`,800); return; }
      }catch(e){}
    }
    setTimeout(()=>btn.textContent='Copier',1000);
  }

  async function toggleReact(id, reaction, btn){
    const key=reaction+'_'+id;
    const isActive=localStorage.getItem(key)==='1';
    const action=isActive?'remove':'add';
    if(action==='add'){
      const other=reaction==='like'?'dislike':'like';
      if(localStorage.getItem(other+'_'+id)==='1'){
        localStorage.setItem(other+'_'+id,'0');
        fetch('/code/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,reaction:other,action:'remove'})});
      }
    }
    localStorage.setItem(key, action==='add'?'1':'0');
    try{
      const res=await fetch('/code/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,reaction,action})});
      const data=await res.json();
      const value=data.value??0;
      btn.innerHTML = reaction==='like' ? `${action==='add'?'❤️':'🤍'} ${value}` : `${action==='add'?'💔':'👎'} ${value}`;
    }catch(e){}
  }

  function renderStories(){
    const items = [
      {name:'+ Partager', cls:'plus', label:'+', action:'share'},
      {name:'Top', cls:'top', label:'🏆', action:'Top'},
      {name:'Uber Eats', cls:'uber', label:'Uber<br>Eats', action:'Uber Eats'},
      {name:'Booking', cls:'book', label:'B', action:'Booking'},
      {name:'Airbnb', cls:'air', label:'A', action:'Airbnb'}
    ];
    document.getElementById('stories').innerHTML = items.map(i =>
      `<div class="story" onclick="onStoryClick('${i.action}')">
        <div class="story-bubble ${i.cls}">${i.label}</div>${i.name}
      </div>`
    ).join('');
  }

  function onStoryClick(name){
    if(name==='share'){ openShare(); return; }
    showPage('home');
    const fromDb = name==='Top' 
      ? [...allCodes].sort((a,b) => ((b.likes||0)*2 + (b.copies||0)) - ((a.likes||0)*2 + (a.copies||0)))
      : allCodes.filter(c => (c.site||'').toLowerCase().includes(name.toLowerCase()));
    document.getElementById('codes-list').innerHTML = fromDb.length 
      ? fromDb.map(c=>renderPost(c)).join('') 
      : `<div class="empty">Pas de code pour ${name}</div>`;
  }

  async function askAI(){
    const q=document.getElementById('ai-input').value.trim();
    if(!q) return;
    const results=document.getElementById('search-results');
    results.innerHTML='<div class="empty">Recherche...</div>';
    try{
      const res=await fetch('/codes/search?q='+encodeURIComponent(q));
      const data=await res.json();
      results.innerHTML=(data.codes||[]).length?(data.codes||[]).map(c=>renderPost(c)).join(''):'<div class="empty">Aucun code trouvé</div>';
    }catch(e){ results.innerHTML='<div class="empty">Erreur recherche</div>'; }
  }

  async function loadProfile(){
    const u=getUser();
    const card=document.getElementById('profile-card');
    if(!u){ card.innerHTML='Ouvre Codia depuis Telegram'; return; }
    const name=u.username?('@'+u.username):(u.first_name||'Membre');
    const photo=u.photo_url?`<img src="${u.photo_url}" style="width:48px;height:48px;border-radius:50%;object-fit:cover">`:`<div class="post-avatar" style="width:48px;height:48px">${name[0]}</div>`;
    card.innerHTML=`<div class="post-top">${photo}<div><div class="post-who">${name}</div><div class="post-meta">Membre Codia</div></div></div>`;

    // Abonnés / Abonnements
    try{
      const res = await fetch('/follow/stats?user_id='+u.id);
      const data = await res.json();
      document.getElementById('followers-count').textContent = data.followers || 0;
      document.getElementById('following-count').textContent = data.following || 0;
    }catch(e){}

    // Mes codes
    try{
      const res=await fetch('/codes/mine?user_id='+u.id);
      const data=await res.json();
      document.getElementById('my-codes').innerHTML=(data.codes||[]).length?(data.codes||[]).map(c=>renderPost(c)).join(''):'<div class="empty">Aucun code publié</div>';
    }catch(e){ document.getElementById('my-codes').innerHTML='<div class="empty">Erreur</div>'; }
  }

  async function loadCodes(){
    try{
      const res=await fetch('/codes');
      const data=await res.json();
      allCodes=data.codes||[];
    }catch(e){ allCodes=[]; }
    renderStories();
    document.getElementById('codes-list').innerHTML =
      allCodes.length ? allCodes.map(c=>renderPost(c)).join('') : '<div class="empty">Feed vide — sois le premier</div>';
  }

  loadCodes();
</script>
</body>
</html>
