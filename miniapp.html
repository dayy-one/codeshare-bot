<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Codia</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg:#000; --card:#121212; --text:#fff; --text2:#a1a1aa;
      --border:#1f1f1f; --accent:#8b5cf6; --accent2:#06b6d4;
      --green:#22c55e; --pink:#ec4899;
    }
    body.light {
      --bg:#fafafa; --card:#fff; --text:#0a0a0a; --text2:#737373;
      --border:#e5e5e5; --accent:#7c3aed; --accent2:#0891b2;
      --green:#16a34a; --pink:#db2777;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;transition:.25s}
    .app{max-width:430px;height:100vh;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
    .header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:10px}
    .logo-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
    .name{font-size:18px;font-weight:700}
    .sub{font-size:11px;color:var(--text2)}
    .header-actions{display:flex;gap:8px}
    .icon-btn{width:36px;height:36px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px}
    .stories{display:flex;gap:12px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--border)}
    .story{min-width:66px;text-align:center;font-size:11px;color:var(--text2)}
    .story-ring{width:56px;height:56px;border-radius:50%;padding:2px;margin:0 auto 6px;background:linear-gradient(45deg,var(--accent),var(--pink),var(--accent2))}
    .story-ring div{width:100%;height:100%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text)}
    .page{display:none;flex:1;overflow-y:auto;padding-bottom:100px}
    .page.active{display:block}
    .search-wrap{padding:14px 16px 8px}
    .search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px}
    .search input{width:100%;border:none;outline:none;background:transparent;color:var(--text);font-size:15px}
    .ai-box{margin:8px 16px 16px;padding:14px 16px;border-radius:16px;background:linear-gradient(180deg,rgba(139,92,246,.12),rgba(6,182,212,.06));border:1px solid var(--border);display:none;font-size:14px;line-height:1.5}
    .section{padding:8px 16px;font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
    .card,.post{margin:0 16px 12px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .muted{color:var(--text2);font-size:12px}
    .pill{background:rgba(34,197,94,.15);color:var(--green);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .post-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:700}
    .code{margin:10px 0;padding:12px;border-radius:14px;background:var(--bg);border:1px dashed var(--border);display:flex;justify-content:space-between;font-family:ui-monospace,Menlo,monospace;font-size:15px}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .actions button{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px}
    .bottom{position:absolute;left:0;right:0;bottom:0;height:84px;border-top:1px solid var(--border);background:rgba(0,0,0,.75);backdrop-filter:blur(16px);display:flex;justify-content:space-around;align-items:center;padding-bottom:14px}
    body.light .bottom{background:rgba(255,255,255,.85)}
    .nav{background:none;border:none;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
    .nav.active{color:var(--text)}
    .nav .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
    .nav.active .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
    .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;border:none;border-radius:999px;padding:12px 22px;font-weight:700;display:none;z-index:20}
    .page-home.active ~ .fab{display:block}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:flex-end;justify-content:center}
    .modal.active{display:flex}
    .sheet{width:100%;max-width:430px;background:var(--card);border-radius:22px 22px 0 0;padding:22px 18px 34px}
    .sheet button,.sheet input{width:100%;margin-bottom:10px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px}
    .sheet input{outline:none}
    .welcome{margin:12px 16px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--border);font-size:13px;line-height:1.45}
    .welcome strong{display:block;margin-bottom:6px;font-size:14px}
    .empty{text-align:center;color:var(--text2);padding:30px 16px;font-size:14px}
    .clickable{cursor:pointer}
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">
      <div class="logo-mark">C</div>
      <div>
        <div class="name">Codia</div>
        <div class="sub">16,254k members</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="notifBtn" onclick="toggleNotif()">🔔</button>
      <button class="icon-btn" onclick="toggleTheme()">◐</button>
    </div>
  </div>

  <div class="stories" id="stories"></div>

  <div class="page page-home active" id="page-home">
    <div class="welcome" id="welcome">
      <strong>Bienvenue sur Codia</strong>
      1) Explore le feed et les bulles<br>
      2) Cherche un code dans Discover<br>
      3) Partage tes codes avec ＋ Partager<br>
      4) Like ou “j’aime pas” un code
    </div>
    <div class="section">À la une</div>
    <div id="daily-codes"></div>
    <div class="section" id="feed-title">Communauté</div>
    <div id="codes-list"><div class="empty">Chargement...</div></div>
  </div>

  <div class="page page-ia" id="page-ia">
    <div class="search-wrap">
      <div class="search">
        <span style="opacity:.7">⌕</span>
        <input id="ai-input" placeholder="Que cherches-tu ? Uber, hôtel, voyage..." onkeypress="if(event.key==='Enter') askAI()">
      </div>
    </div>
    <div class="ai-box" id="ai-response"></div>
    <div class="section">Suggestions pour toi</div>
    <div id="suggestions"></div>
  </div>

  <button class="fab" onclick="openShare()">＋ Partager</button>

  <div class="bottom">
    <button class="nav active" onclick="showPage('home')"><div class="ic">⌂</div>Feed</button>
    <button class="nav" onclick="showPage('ia')"><div class="ic">✦</div>Discover</button>
  </div>
</div>

<div class="modal" id="shareModal">
  <div class="sheet">
    <div style="text-align:center;font-weight:700;margin-bottom:14px">Partager un code</div>
    <button onclick="chooseShare('promo')">Code promo</button>
    <button onclick="chooseShare('parrainage')">Code parrainage</button>
    <button onclick="closeShare()">Annuler</button>
  </div>
</div>

<div class="modal" id="formModal">
  <div class="sheet">
    <div style="text-align:center;font-weight:700;margin-bottom:14px" id="formTitle">Nouveau code</div>
    <input id="formSite" placeholder="Site (ex: Uber Eats)">
    <input id="formCode" placeholder="Code">
    <input id="formDesc" placeholder="Ex: -20% ou +80€">
    <button onclick="submitCode()">Publier</button>
    <button onclick="closeForm()">Annuler</button>
  </div>
</div>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

  const ARCHIVES = {
    "Top": [
      {site:"Uber Eats", code:"EATS10", description:"-10€", type:"promo", added_by:"Archive Codia"},
      {site:"Booking", code:"TRAVEL15", description:"-15%", type:"promo", added_by:"Archive Codia"}
    ],
    "Uber Eats": [
      {site:"Uber Eats", code:"EATS10", description:"-10€", type:"promo", added_by:"Archive Codia"}
    ],
    "Booking": [
      {site:"Booking", code:"TRAVEL15", description:"-15%", type:"promo", added_by:"Archive Codia"}
    ],
    "Airbnb": [
      {site:"Airbnb", code:"HOME12", description:"-12%", type:"promo", added_by:"Archive Codia"}
    ],
    "Getaround": [
      {site:"Getaround", code:"DRIVE20", description:"-20%", type:"promo", added_by:"Archive Codia"}
    ],
    "Banques": [
      {site:"Fortuneo", code:"FORTU80", description:"+80€", type:"parrainage", added_by:"Archive Codia"}
    ]
  };

  let allCodes = [];
  let userCity = null;
  let currentShareType = "promo";

  if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
  if (localStorage.getItem('notif') === 'off') document.getElementById('notifBtn').textContent = '🔕';

  function toggleTheme(){
    document.body.classList.toggle('light');
    localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
  }
  function toggleNotif(){
    const off = localStorage.getItem('notif') === 'off';
    localStorage.setItem('notif', off ? 'on' : 'off');
    document.getElementById('notifBtn').textContent = off ? '🔔' : '🔕';
    alert(off ? 'Notifications activées' : 'Notifications désactivées');
  }

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      try{
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
        const data = await res.json();
        userCity = data.address?.city || data.address?.town || data.address?.village || null;
      }catch(e){}
    },()=>{},{timeout:4000});
  }

  function showPage(page){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
    if(page==='home'){
      document.getElementById('page-home').classList.add('active');
      document.querySelectorAll('.nav')[0].classList.add('active');
    } else {
      document.getElementById('page-ia').classList.add('active');
      document.querySelectorAll('.nav')[1].classList.add('active');
    }
  }

  function openShare(){ document.getElementById('shareModal').classList.add('active'); }
  function closeShare(){ document.getElementById('shareModal').classList.remove('active'); }
  function closeForm(){ document.getElementById('formModal').classList.remove('active'); }

  function chooseShare(type){
    currentShareType = type;
    closeShare();
    document.getElementById('formTitle').textContent = type === 'promo' ? 'Nouveau code promo' : 'Nouveau code parrainage';
    document.getElementById('formSite').value = '';
    document.getElementById('formCode').value = '';
    document.getElementById('formDesc').value = '';
    document.getElementById('formModal').classList.add('active');
  }

  async function submitCode(){
    const site = document.getElementById('formSite').value.trim();
    const code = document.getElementById('formCode').value.trim();
    const description = document.getElementById('formDesc').value.trim();
    if(!site || !code){ alert('Site et code obligatoires'); return; }

    const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
    const added_by = tgUser?.username ? '@'+tgUser.username : (tgUser?.first_name || 'Membre Codia');

    try{
      const res = await fetch('/codes/add', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ type: currentShareType, site, code, description, added_by })
      });
      const data = await res.json();
      if(data.success){
        closeForm();
        alert('Code publié sur Codia ✅');
        await loadCodes();
        showPage('home');
      } else alert('Erreur publication');
    }catch(e){ alert('Erreur publication'); }
  }

  function renderStories(){
    const base = ["Top","Uber Eats","Booking","Airbnb","Getaround","Banques"];
    const dynamicSites = [...new Set(allCodes.map(c => c.site).filter(Boolean))];
    const names = ["+ Partager", ...base, ...dynamicSites.filter(s => !base.includes(s)).slice(0,6)];
    document.getElementById('stories').innerHTML = names.map(name=>{
      const label = name === "+ Partager" ? "+" : name.slice(0,1).toUpperCase();
      return `<div class="story clickable" onclick="onStoryClick('${name.replace(/'/g,"\\'")}')">
        <div class="story-ring"><div>${label}</div></div>
        ${name.length>10 ? name.slice(0,9)+'…' : name}
      </div>`;
    }).join('');
  }

  function onStoryClick(name){
    if(name === "+ Partager"){ openShare(); return; }
    showPage('home');
    showArchive(name);
  }

  function showArchive(name){
    const fromDb = allCodes.filter(c =>
      (c.site||'').toLowerCase().includes(name.toLowerCase()) ||
      name==='Top' ||
      (name==='Banques' && /fortuneo|bourso|bank|banque/i.test(c.site||''))
    );
    const archive = ARCHIVES[name] || [];
    const merged = [...fromDb, ...archive];
    document.getElementById('feed-title').textContent = `Archive • ${name}`;
    document.getElementById('welcome').style.display = 'none';
    const list = document.getElementById('codes-list');
    if(!merged.length){
      list.innerHTML = `<div class="empty">Pas encore de code pour ${name}.</div>`;
      return;
    }
    list.innerHTML = merged.map((c,i)=>renderPost(c,i+1000)).join('');
  }

  function renderPost(c, fallbackId){
    const id = c.id || fallbackId;
    const liked = localStorage.getItem('like_'+id) === '1';
    const disliked = localStorage.getItem('dislike_'+id) === '1';

    return `<div class="post">
      <div class="post-top">
        <div class="avatar">${(c.added_by||'C')[0].toUpperCase()}</div>
        <div>
          <div style="font-weight:600">${c.added_by || 'Membre Codia'}</div>
          <div class="muted">${c.site}</div>
        </div>
      </div>
      <div>${c.type==='parrainage' ? 'code parrainage' : 'code promo'}</div>
      <div class="code"><span>${c.code}</span><span style="color:var(--green)">${c.description||''}</span></div>
      <div class="actions">
        ${c.id ? `
          <button onclick="toggleReact(${c.id}, 'like', this)">${liked ? '❤️' : '🤍'} <span>${c.likes||0}</span></button>
          <button onclick="toggleReact(${c.id}, 'dislike', this)">${disliked ? '💔' : '👎'} <span>${c.dislikes||0}</span></button>
        ` : `<span class="muted">Archive</span>`}
      </div>
    </div>`;
  }

  function renderSuggestions(){
    const base = [
      {site:"Booking", subtitle:"Hôtels & voyages", desc:"-15%"},
      {site:"Uber Eats", subtitle:"Nourriture", desc:"-10€"},
      {site:"Getaround", subtitle:"Location véhicule", desc:"-20%"},
      {site:"Airbnb", subtitle:"Logements", desc:"-12%"},
      {site:"Banques", subtitle:"Parrainages", desc:"+80€"}
    ];
    const dynamic = [...new Set(allCodes.map(c=>c.site).filter(Boolean))]
      .filter(s => !base.find(b => b.site.toLowerCase()===s.toLowerCase()))
      .slice(0,6)
      .map(s => ({site:s, subtitle:"Nouveau site", desc:"Codes"}));
    const items = [...base, ...dynamic];
    document.getElementById('suggestions').innerHTML = items.map(item => `
      <div class="card row clickable" onclick="onStoryClick('${item.site.replace(/'/g,"\\'")}')">
        <div><strong>${item.site}</strong><div class="muted">${item.subtitle}</div></div>
        <div class="pill">${item.desc}</div>
      </div>
    `).join('');
  }

  async function toggleReact(id, reaction, btn){
    const key = reaction + '_' + id;
    const isActive = localStorage.getItem(key) === '1';
    const action = isActive ? 'remove' : 'add';

    // si like actif, retire dislike (et inversement)
    if(action === 'add'){
      const other = reaction === 'like' ? 'dislike' : 'like';
      if(localStorage.getItem(other + '_' + id) === '1'){
        localStorage.setItem(other + '_' + id, '0');
        fetch('/code/react', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id, reaction: other, action:'remove'})
        });
      }
    }

    localStorage.setItem(key, action === 'add' ? '1' : '0');

    try{
      const res = await fetch('/code/react', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({id, reaction, action})
      });
      const data = await res.json();
      const span = btn.querySelector('span');
      if(data && typeof data.value !== 'undefined'){
        span.textContent = data.value;
      } else {
        const n = parseInt(span.textContent||'0')||0;
        span.textContent = action === 'add' ? n+1 : Math.max(n-1,0);
      }
      if(reaction === 'like'){
        btn.innerHTML = `${action==='add'?'❤️':'🤍'} <span>${span.textContent}</span>`;
      } else {
        btn.innerHTML = `${action==='add'?'💔':'👎'} <span>${span.textContent}</span>`;
      }
    }catch(e){}
  }

  async function askAI(){
    const input = document.getElementById('ai-input');
    const box = document.getElementById('ai-response');
    const q = input.value.trim();
    if(!q) return;
    box.style.display='block';
    box.innerHTML='Recherche en cours...';
    try{
      const res = await fetch('/ask', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({question:q, city:userCity})
      });
      const data = await res.json();
      box.innerHTML = data.answer || 'Voici une offre intéressante pour toi.';
    }catch(e){
      box.innerHTML = 'Voici une bonne piste : Booking, Uber Eats ou Getaround.';
    }
  }

  async function loadCodes(){
    try{
      const res = await fetch('/codes');
      const data = await res.json();
      allCodes = data.codes || [];
    }catch(e){
      allCodes = [];
    }

    renderStories();
    renderSuggestions();

    const daily = document.getElementById('daily-codes');
    const list = document.getElementById('codes-list');
    const top = allCodes.length ? allCodes.slice(0,3) : ARCHIVES["Top"];

    daily.innerHTML = top.map(c => `
      <div class="card row">
        <div>
          <strong>${c.site}</strong>
          <div class="muted">${c.type || 'promo'} • ${c.code}</div>
        </div>
        <div class="pill">${c.description || 'Promo'}</div>
      </div>
    `).join('');

    if(allCodes.length){
      document.getElementById('feed-title').textContent = 'Communauté';
      list.innerHTML = allCodes.map(c => renderPost(c)).join('');
    } else {
      document.getElementById('feed-title').textContent = 'Archives Codia';
      list.innerHTML = ARCHIVES["Top"].map((c,i)=>renderPost(c,i+1)).join('');
    }
  }

  loadCodes();
</script>
</body>
</html>
