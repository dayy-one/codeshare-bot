<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f7f1">
<title>COD.IA — Connexion</title>
<style>
:root{
  --bg:#f8f7f1;--ink:#172019;--muted:#747b77;
  --green:#4e702f;--green2:#668b43;--line:rgba(48,67,45,.14);
  --serif:Georgia,"Times New Roman",serif
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif
}
button,input{font:inherit}
a{text-decoration:none;color:inherit}
.page{
  min-height:100vh;position:relative;
  background:
    radial-gradient(circle at 50% 28%,rgba(255,255,255,.96),transparent 36%),
    radial-gradient(circle at 0% 100%,rgba(225,234,207,.42),transparent 28%),
    var(--bg)
}
.nav{
  height:78px;padding:0 clamp(20px,5vw,76px);
  display:flex;align-items:center;justify-content:space-between
}
.back{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 14px;border:1px solid rgba(48,67,45,.11);
  border-radius:999px;background:rgba(255,255,255,.66);
  color:#59635d;font-size:11px;font-weight:850
}
.main{min-height:calc(100vh - 78px);display:flex;justify-content:center;align-items:center;padding:42px 20px}
.content{width:min(500px,100%);text-align:center}
.eyebrow{display:inline-block;font-size:10px;font-weight:900;letter-spacing:3px;color:#668052;margin-bottom:9px}
.intro h1{margin:0;font:700 clamp(38px,5vw,50px)/.98 var(--serif);letter-spacing:-2.7px}
.intro p{margin:11px 0 0;color:#7a837d;font-size:14px}
.card{
  text-align:left;background:rgba(255,255,255,.96);
  border:1px solid rgba(48,67,45,.11);border-radius:27px;
  padding:34px 32px 28px;box-shadow:0 24px 70px rgba(44,61,39,.075)
}
.card-head{text-align:center;margin-bottom:22px}
.card h1{margin:0;font:700 34px/1.02 var(--serif);letter-spacing:-1.7px}
.card-sub{margin:9px 0 0;color:#737c77;font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#f1f3ee;border:1px solid #e2e7de;border-radius:14px;margin-bottom:22px}
.tab{height:42px;border:0;border-radius:10px;background:transparent;color:#7a837d;font-size:12px;font-weight:850;cursor:pointer}
.tab.active{background:#fff;color:#45672f;box-shadow:0 4px 14px rgba(30,52,30,.075)}
.form-panel{display:none}
.form-panel.active{display:block}
.field{margin-top:15px}
.field label{display:block;font-size:13px;font-weight:800;margin:0 0 8px 2px}
.input-wrap{position:relative}
.input-wrap input{
  width:100%;height:56px;border-radius:15px;border:1px solid #d8ded4;
  background:#fefefd;padding:0 17px;outline:none
}
.input-wrap input:focus{border-color:#7f9d61;box-shadow:0 0 0 4px rgba(105,139,69,.085)}
.eye{position:absolute;right:7px;top:8px;width:40px;height:40px;border:0;background:transparent;cursor:pointer;color:#668052}
.row{display:flex;justify-content:flex-end;margin:10px 2px 0}
.forgot{font-size:12px;color:#55743a;font-weight:800}
.primary{
  width:100%;height:56px;margin-top:21px;border:0;border-radius:15px;color:#fff;
  background:linear-gradient(135deg,#5b7f3a,#45682b);font-weight:850;cursor:pointer
}
.primary:disabled{opacity:.65}
.message{min-height:18px;margin:11px 2px 0;text-align:center;color:#a3473f;font-size:12px;font-weight:700}
.message.ok{color:#4e702f}
.hint{color:#8b938e;font-size:10px;margin-top:6px}
</style>
</head>
<body>
<div class="page">
  <header class="nav">
    <a class="back" href="/">← Retour à COD.IA</a>
  </header>

  <main class="main">
    <section class="content">
      <div class="intro">
        <span class="eyebrow">ESPACE PERSONNEL</span>
        <h1>Bienvenue sur COD.IA</h1>
        <p>Ton espace personnel, simplement.</p>
      </div>

      <section class="card">
        <div class="card-head">
          <h1 id="cardTitle">Se connecter</h1>
          <p class="card-sub" id="cardSub">Accède à ton espace COD.IA</p>
        </div>

        <div class="tabs">
          <button class="tab active" id="loginTab" type="button" onclick="showTab('login')">Connexion</button>
          <button class="tab" id="registerTab" type="button" onclick="showTab('register')">Inscription</button>
        </div>

        <form id="loginPanel" class="form-panel active" onsubmit="return false">
          <div class="field">
            <label for="identifier">Email ou username</label>
            <div class="input-wrap">
              <input id="identifier" type="text" autocomplete="username" required>
            </div>
          </div>
          <div class="field">
            <label for="password">Mot de passe</label>
            <div class="input-wrap">
              <input id="password" type="password" autocomplete="current-password" required>
              <button class="eye" type="button" onclick="togglePassword('password')">👁</button>
            </div>
          </div>
          <div class="row">
            <a class="forgot" href="mailto:contact@cod-ia.fr?subject=Mot%20de%20passe%20oublié">Mot de passe oublié ?</a>
          </div>
          <button id="loginBtn" class="primary" type="button" onclick="login()">Se connecter →</button>
          <div id="loginMessage" class="message"></div>
        </form>

        <form id="registerPanel" class="form-panel" onsubmit="return false">
          <div class="field">
            <label for="registerName">Nom / prénom</label>
            <div class="input-wrap"><input id="registerName" required></div>
          </div>
          <div class="field">
            <label for="registerUsername">Nom utilisateur</label>
            <div class="input-wrap"><input id="registerUsername" minlength="3" required></div>
            <div class="hint">3 caractères minimum</div>
          </div>
          <div class="field">
            <label for="registerEmail">Adresse e-mail</label>
            <div class="input-wrap"><input id="registerEmail" type="email" required></div>
          </div>
          <div class="field">
            <label for="registerPassword">Mot de passe</label>
            <div class="input-wrap">
              <input id="registerPassword" type="password" minlength="8" required>
              <button class="eye" type="button" onclick="togglePassword('registerPassword')">👁</button>
            </div>
          </div>
          <button id="registerBtn" class="primary" type="button" onclick="register()">Créer mon compte →</button>
          <div id="registerMessage" class="message"></div>
        </form>
      </section>
    </section>
  </main>
</div>

<script>
function showTab(tab){
  const loginActive = tab === "login";
  document.getElementById("loginTab").classList.toggle("active", loginActive);
  document.getElementById("registerTab").classList.toggle("active", !loginActive);
  document.getElementById("loginPanel").classList.toggle("active", loginActive);
  document.getElementById("registerPanel").classList.toggle("active", !loginActive);
  document.getElementById("cardTitle").textContent = loginActive ? "Se connecter" : "Créer ton compte";
  document.getElementById("cardSub").textContent = loginActive ? "Accède à ton espace COD.IA" : "Rejoins COD.IA en quelques secondes";
}
function togglePassword(id){
  const el=document.getElementById(id);
  el.type = el.type === "password" ? "text" : "password";
}
function setMessage(id,text,ok){
  const el=document.getElementById(id);
  if(!el) return;
  el.textContent=text||"";
  el.classList.toggle("ok",!!ok);
}

async function login(){
  const btn=document.getElementById("loginBtn");
  if(btn) btn.disabled=true;
  setMessage("loginMessage","");
  try{
    const r=await fetch("/auth/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"same-origin",
      body:JSON.stringify({
        identifier:document.getElementById("identifier").value.trim(),
        password:document.getElementById("password").value
      })
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok || !data.ok){
      setMessage("loginMessage", data.error || "Email ou mot de passe incorrect.");
      if(btn) btn.disabled=false;
      return;
    }
    location.href="/app";
  }catch(e){
    setMessage("loginMessage","Impossible de contacter COD.IA.");
    if(btn) btn.disabled=false;
  }
}

async function register(){
  const btn=document.getElementById("registerBtn");
  if(btn) btn.disabled=true;
  setMessage("registerMessage","");
  try{
    const r=await fetch("/auth/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"same-origin",
      body:JSON.stringify({
        display_name:document.getElementById("registerName").value.trim(),
        username:document.getElementById("registerUsername").value.trim(),
        email:document.getElementById("registerEmail").value.trim(),
        password:document.getElementById("registerPassword").value,
        referral_code:""
      })
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok || !data.ok){
      setMessage("registerMessage", data.error || "Impossible de créer le compte.");
      if(btn) btn.disabled=false;
      return;
    }
    location.href="/app";
  }catch(e){
    setMessage("registerMessage","Impossible de contacter COD.IA.");
    if(btn) btn.disabled=false;
  }
}

if(location.pathname.indexOf("register")!==-1){
  showTab("register");
}

(function(){
  const API="https://countapi.mileshilliard.com/api/v1";
  const KEYS={
    visits:"codia-fr-visites-unique-xyz123",
    connexion:"codia-fr-clics-connexion-xyz123",
    inscription:"codia-fr-clics-inscription-xyz123"
  };
  const hit=key=>fetch(API+"/hit/"+encodeURIComponent(key)).catch(()=>{});
  try{
    if(!sessionStorage.getItem("codia_visit_counted")){
      hit(KEYS.visits);
      sessionStorage.setItem("codia_visit_counted","1");
    }
  }catch(e){
    hit(KEYS.visits);
  }
  document.addEventListener("click",e=>{
    const t=(e.target.closest("button,a")?.innerText||"").toLowerCase();
    if(t.includes("se connecter")||t.includes("connexion")) hit(KEYS.connexion);
    if(t.includes("créer mon compte")||t.includes("inscription")) hit(KEYS.inscription);
  });
})();
</script>
</body>
</html>
